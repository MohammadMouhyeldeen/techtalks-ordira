{% extends "base.html" %}

{% block content %}
<div class="container">
    <h1>{{ page_title }}</h1>

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Save</button>

        <a href="{% url 'shops:delivery-zone-list' shop_pk=shop.pk %}">
            Cancel
        </a>
    </form>
</div>
{% endblock %}
