<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Set | Ordira</title>
    <meta name="description" content="Your Ordira password has been set. You can now log in.">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%234B3CF0'/%3E%3Cpath d='M18 33l9 9 19-19' stroke='white' stroke-width='6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/accounts/css/auth.css">
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-header">
                <a href="/" class="auth-brand">
                    <span class="auth-brand-mark" aria-hidden="true">
                        <svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    </span>
                    Ordira
                </a>
                <h1>Password set</h1>
                <p>Your account is ready. Log in to get started.</p>
            </div>

            <div style="text-align:center;padding:0.5rem 0 1.5rem;">
                <svg width="56" height="56" viewBox="0 0 24 24" fill="none"
                     style="margin:0 auto 1.25rem;display:block;color:#22c55e;" aria-hidden="true">
                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"
                          stroke="currentColor" stroke-width="1.8"
                          stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M22 4L12 14.01l-3-3"
                          stroke="currentColor" stroke-width="1.8"
                          stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <p style="color:var(--ink-300);margin-bottom:1.75rem;">
                    You can now log in with your email address and the password you just set.
                </p>
                <a href="{% url 'accounts:login' %}"
                   class="btn-auth"
                   id="go-to-login"
                   style="display:inline-flex;text-decoration:none;">
                    Log In
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                        <path d="M5 12h14M13 5l7 7-7 7" stroke="currentColor"
                              stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </a>
            </div>
        </div>
    </div>
</body>
</html>
