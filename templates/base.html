{% load static %}

<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <title>{% block title %}Ordira{% endblock %}</title>

    <meta name="description" content="{% block meta_description %}Ordira - Manage your online shop{% endblock %}">

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Main Styles -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #4b3cf0;
            --primary-dark: #3d2fc7;
            --primary-light: #f0eeff;

            --background: #f7f7fb;
            --surface: #ffffff;

            --text-primary: #17171c;
            --text-secondary: #6b6b76;
            --text-light: #9999a5;

            --border: #e8e8ef;

            --success: #22a06b;
            --warning: #e9a23b;
            --danger: #dc4c64;

            --sidebar-width: 250px;
            --navbar-height: 70px;

            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 14px;

            --shadow-sm: 0 2px 8px rgba(20, 20, 40, 0.04);
            --shadow-md: 0 6px 20px rgba(20, 20, 40, 0.07);
        }

        body {
            font-family: "Plus Jakarta Sans", sans-serif;
            background: var(--background);
            color: var(--text-primary);
            min-height: 100vh;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        button,
        input,
        select,
        textarea {
            font-family: inherit;
        }

        /* =========================
       NAVBAR
    ========================== */

        .navbar {
            height: var(--navbar-height);
            background: var(--surface);
            border-bottom: 1px solid var(--border);

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 25px;

            position: fixed;
            top: 0;
            left: 0;
            right: 0;

            z-index: 1000;
        }

        .navbar-left {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .navbar-right {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .logo {
            font-size: 23px;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: -0.5px;
        }

        .menu-toggle {
            display: none;

            border: none;
            background: none;

            font-size: 24px;
            cursor: pointer;
        }

        /* Notification */

        .notification-btn {
            width: 38px;
            height: 38px;

            display: flex;
            align-items: center;
            justify-content: center;

            border: none;
            border-radius: 50%;

            background: transparent;

            font-size: 19px;

            cursor: pointer;

            position: relative;
        }

        .notification-btn:hover {
            background: var(--primary-light);
        }

        .notification-badge {
            position: absolute;

            top: 3px;
            right: 2px;

            min-width: 16px;
            height: 16px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: var(--danger);
            color: white;

            font-size: 9px;
            font-weight: 600;
        }

        /* User */

        .user-menu {
            display: flex;
            align-items: center;
            gap: 10px;

            cursor: pointer;
        }

        .user-avatar {
            width: 38px;
            height: 38px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: var(--primary-light);
            color: var(--primary);

            font-size: 14px;
            font-weight: 700;
        }

        .user-info {
            display: flex;
            flex-direction: column;
        }

        .user-name {
            font-size: 13px;
            font-weight: 600;
        }

        .user-role {
            font-size: 11px;
            color: var(--text-secondary);
        }

        /* =========================
       SIDEBAR
    ========================== */

        .sidebar {
            width: var(--sidebar-width);

            position: fixed;

            top: var(--navbar-height);
            bottom: 0;
            left: 0;

            background: var(--surface);

            border-right: 1px solid var(--border);

            padding: 20px 14px;

            overflow-y: auto;

            z-index: 900;
        }

        .sidebar-section {
            margin-bottom: 25px;
        }

        .sidebar-title {
            padding: 0 12px;
            margin-bottom: 8px;

            color: var(--text-light);

            font-size: 10px;
            font-weight: 700;

            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .sidebar-link {
            display: flex;
            align-items: center;
            gap: 12px;

            width: 100%;

            padding: 11px 12px;

            margin-bottom: 3px;

            border-radius: var(--radius-md);

            color: var(--text-secondary);

            font-size: 13px;
            font-weight: 500;

            transition: 0.2s ease;
        }

        .sidebar-link:hover {
            background: var(--primary-light);
            color: var(--primary);
        }

        .sidebar-link.active {
            background: var(--primary-light);
            color: var(--primary);
            font-weight: 600;
        }

        .sidebar-icon {
            width: 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 17px;
        }

        /* =========================
       MAIN CONTENT
    ========================== */

        .main-wrapper {
            margin-left: var(--sidebar-width);

            padding-top: var(--navbar-height);

            min-height: 100vh;
        }

        .main-content {
            padding: 30px;
            min-height: calc(100vh - var(--navbar-height));
        }

        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 25px;
        }

        .page-title {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .page-subtitle {
            margin-top: 5px;

            color: var(--text-secondary);

            font-size: 13px;
        }

        /* =========================
       COMMON CARDS
    ========================== */

        .card {
            background: var(--surface);

            border: 1px solid var(--border);
            border-radius: var(--radius-lg);

            padding: 20px;

            box-shadow: var(--shadow-sm);
        }

        /* =========================
       BUTTONS
    ========================== */

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;

            padding: 10px 16px;

            border: none;
            border-radius: var(--radius-md);

            font-size: 13px;
            font-weight: 600;

            cursor: pointer;

            transition: 0.2s ease;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
        }

        .btn-secondary {
            background: var(--primary-light);
            color: var(--primary);
        }

        .btn-danger {
            background: #fff0f2;
            color: var(--danger);
        }

        /* =========================
       RESPONSIVE
    ========================== */

        @media (max-width: 900px) {

            .menu-toggle {
                display: block;
            }

            .sidebar {
                transform: translateX(-100%);
                transition: 0.3s ease;
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .main-wrapper {
                margin-left: 0;
            }

            .user-info {
                display: none;
            }
        }

        @media (max-width: 600px) {

            .navbar {
                padding: 0 15px;
            }

            .main-content {
                padding: 20px 15px;
            }
        }

        .message {
            padding: 12px 16px;
            margin-bottom: 16px;
            border-radius: 8px;
        }

        .message-success {
            background: var(--primary-100);
            color: var(--primary-600);
        }

        .message-error {
            background: #fee2e2;
            color: #b91c1c;
        }

        .sidebar-logout {
            background: none;
            border: none;
            font: inherit;
            cursor: pointer;
            text-align: left;
        }
    </style>

    {% block extra_css %}{% endblock %}


</head>

<body>


    <!-- =========================
     NAVBAR
========================== -->

    {% include "components/navbar.html" %}

    <!-- =========================
     APPLICATION LAYOUT
========================== -->

    <div class="main-wrapper">

        {% include "components/sidebar.html" %}

        <main class="main-content">

            {% if messages %}
            <div class="messages">
                {% for message in messages %}
                <div class="message message-{{ message.tags }}">{{ message }}</div>
                {% endfor %}
            </div>
            {% endif %}

            {% block content %}
            {% endblock %}

        </main>

    </div>


</body>

</html>
