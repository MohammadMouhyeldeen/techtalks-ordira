<aside class="sidebar">

    <!-- =========================
         MAIN
    ========================== -->

    <div class="sidebar-section">

        <div class="sidebar-title">
            Main
        </div>

        <a href="{% url 'shops:dashboard' %}"
           class="sidebar-link{% if request.resolver_match.view_name == 'shops:dashboard' %} active{% endif %}">

            <span class="sidebar-icon"><svg width="18" height="18"><use href="#i-dashboard"/></svg></span>

            <span>Dashboard</span>

        </a>

    </div>

    <!-- =========================
         SHOP
    ========================== -->

    <div class="sidebar-section">

        <div class="sidebar-title">
            Shop
        </div>

        <a href="{% url 'shops:settings' %}"
           class="sidebar-link{% if request.resolver_match.view_name == 'shops:settings' %} active{% endif %}">

            <span class="sidebar-icon"><svg width="18" height="18"><use href="#i-store"/></svg></span>

            <span>Shop Settings</span>

        </a>


        <a href="#"
           class="sidebar-link">

            <span class="sidebar-icon"><svg width="18" height="18"><use href="#i-users"/></svg></span>

            <span>Customers</span>

        </a>


        <a href="#"
           class="sidebar-link">

            <span class="sidebar-icon"><svg width="18" height="18"><use href="#i-truck"/></svg></span>

            <span>Delivery Zones</span>

        </a>
    </div>

    {% if shop %}
    <!-- =========================
         CATALOG
    ========================== -->

    <div class="sidebar-section">

        <div class="sidebar-title">
            Catalog
        </div>

        <a href="{% url 'products:product-list' shop_pk=shop.pk %}"
             class="sidebar-link">

            <span class="sidebar-icon"><svg width="18" height="18"><use href="#i-tag"/></svg></span>

            <span>Products</span>

        </a>


        <a href="#"
           class="sidebar-link">

            <span class="sidebar-icon"><svg width="18" height="18"><use href="#i-box"/></svg></span>

            <span>Inventory</span>

        </a>

    </div>
    {% endif %}

    <!-- =========================
         ORDERS
    ========================== -->

    <div class="sidebar-section">

        <div class="sidebar-title">
            Sales
        </div>

       {% if shop %}
    <a
        href="{% url 'orders:order-list' shop_pk=shop.pk %}"
        class="sidebar-link"
    >
        <span class="sidebar-icon">
            <svg width="18" height="18">
                <use href="#i-cart"/>
            </svg>
        </span>

        <span>Orders</span>
    </a>
{% else %}
    <span
        class="sidebar-link sidebar-link-disabled"
        aria-disabled="true"
    >
        <span class="sidebar-icon">
            <svg width="18" height="18">
                <use href="#i-cart"/>
            </svg>
        </span>

        <span>Orders</span>
    </span>
{% endif %}


       {% if shop %}
        <a href="{% url 'shops:payment-method-settings' shop_pk=shop.pk %}"
           class="sidebar-link{% if request.resolver_match.view_name == 'shops:payment-method-settings' %} active{% endif %}">

            <span class="sidebar-icon"><svg width="18" height="18"><use href="#i-wallet"/></svg></span>

            <span>Payment Methods</span>

        </a>
        {% endif %}
    </div>

    <!-- =========================
      ACCOUNT
    ========================== -->

    <div class="sidebar-section">

        <div class="sidebar-title">
            Account
        </div>

        <a href="#"
           class="sidebar-link">

            <span class="sidebar-icon"><svg width="18" height="18"><use href="#i-settings"/></svg></span>

            <span>Settings</span>

        </a>


       <form method="post" action="{% url 'accounts:logout' %}">
        {% csrf_token %}
        <button type="submit" class="sidebar-link sidebar-logout">
            <span class="sidebar-icon"><svg width="18" height="18"><use href="#i-logout"/></svg></span>
            <span>Logout</span>
        </button>
    </form>
    </div>

</aside>
